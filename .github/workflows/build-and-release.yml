name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from csproj
      id: get_version
      run: |
        VERSION=$(grep -oP '<Version>\K[^<]+' LinuxClipboard.csproj)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Download latest release asset
      run: |
        echo "Downloading latest LinuxClipboard.dll from releases..."
        gh release download --pattern "LinuxClipboard.dll" --dir ./download || echo "No existing release found"
        ls -la ./download/ 2>/dev/null || echo "Download failed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./download/LinuxClipboard.dll
        tag_name: v${{ steps.get_version.outputs.VERSION }}-${{ github.run_number }}
        name: Release v${{ steps.get_version.outputs.VERSION }}-${{ github.run_number }}
        body: |
          Automated release from commit `${{ github.sha }}`

          ## Changes
          ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build artifacts (backup)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: LinuxClipboard.dll
        path: ./download/LinuxClipboard.dll
