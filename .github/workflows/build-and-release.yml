name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
      continue-on-error: true

    - name: Setup .NET 10.0 (Preview fallback)
      if: failure()
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.100-preview.7.24466.3'
        dotnet-quality: 'preview'

    - name: Download ResoniteModLoader + Harmony via dotnet
      run: |
        set -euo pipefail
        OUTPUT_DIR="${{ github.workspace }}/stubs/prebuilt"

        mkdir -p "${OUTPUT_DIR}/Libraries" "${OUTPUT_DIR}/rml_libs"

        echo "=== Ensuring ResoniteModLoader.dll is present ==="
        if [ ! -f "${OUTPUT_DIR}/Libraries/ResoniteModLoader.dll" ]; then
          cat > /tmp/resmod.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <RestoreIgnoreFailedSources>true</RestoreIgnoreFailedSources>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="ResoniteModLoader" Version="5.0.1" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore /tmp/resmod.csproj
          DLL_PATH="$HOME/.nuget/packages/resonitemodloader/5.0.1/lib/net10.0/ResoniteModLoader.dll"
          if [ ! -f "$DLL_PATH" ]; then
            echo "Could not find ResoniteModLoader dll at $DLL_PATH" >&2
            exit 1
          fi
          cp "$DLL_PATH" "${OUTPUT_DIR}/Libraries/ResoniteModLoader.dll"
        fi

        echo "=== Ensuring 0Harmony.dll is present ==="
        if [ ! -f "${OUTPUT_DIR}/rml_libs/0Harmony.dll" ]; then
          # Use dotnet to restore the package, then copy the runtime assembly.
          cat > /tmp/harmony.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <RestoreIgnoreFailedSources>true</RestoreIgnoreFailedSources>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Lib.Harmony" Version="2.3.3" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore /tmp/harmony.csproj
          DLL_PATH=$(dotnet --info >/dev/null 2>&1; find "$HOME/.nuget/packages" -path '*Lib.Harmony*' -name '0Harmony.dll' | sort | head -n 1)
          if [ -z "$DLL_PATH" ]; then
            # Fallback: use known nuget package layout.
             DLL_PATH="$HOME/.nuget/packages/lib.harmony/2.3.3/lib/net10.0/0Harmony.dll"
          fi
          cp "$DLL_PATH" "${OUTPUT_DIR}/rml_libs/0Harmony.dll"
        fi

        echo "=== DLLs used for build ==="
          ls -la "${OUTPUT_DIR}/Libraries" "${OUTPUT_DIR}/rml_libs" || true

    - name: Restore dependencies
      run: dotnet restore LinuxClipboard.csproj

    - name: Build
      run: dotnet build LinuxClipboard.csproj --configuration Release --no-restore

    - name: Get version from csproj
      id: get_version
      run: |
        VERSION=$(grep -oP '<Version>\K[^<]+' LinuxClipboard.csproj)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./bin/Release/net10.0/LinuxClipboard.dll
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: Release v${{ steps.get_version.outputs.VERSION }}
        body: |
          Automated release from commit `${{ github.sha }}`

          ## Changes
          ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build artifacts (backup)
      uses: actions/upload-artifact@v4
      with:
        name: LinuxClipboard.dll
        path: ./bin/Release/net10.0/LinuxClipboard.dll
