name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
      continue-on-error: true

    - name: Setup .NET 10.0 (Preview fallback)
      if: failure()
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.100-preview.7.24466.3'
        dotnet-quality: 'preview'

    - name: Download open-source DLLs
      run: |
        STUB_DIR="${{ github.workspace }}/stubs"
        OUTPUT_DIR="${STUB_DIR}/prebuilt"
        mkdir -p "${OUTPUT_DIR}/Libraries"
        mkdir -p "${OUTPUT_DIR}/rml_libs"

        # Download ResoniteModLoader.dll from GitHub releases
        echo "Downloading ResoniteModLoader..."
        curl -sL "https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/ResoniteModLoader.dll" -o "${OUTPUT_DIR}/Libraries/ResoniteModLoader.dll"

        # Download 0Harmony.dll (HarmonyLib) from NuGet
        echo "Downloading HarmonyLib (0Harmony)..."
        curl -sL "https://www.nuget.org/api/v2/package/Lib.Harmony/2.3.3" -o /tmp/harmony.nupkg
        unzip -q /tmp/harmony.nupkg -d /tmp/harmony
        cp /tmp/harmony/lib/net8.0/0Harmony.dll "${OUTPUT_DIR}/rml_libs/"
        rm -rf /tmp/harmony /tmp/harmony.nupkg

        echo "=== Downloaded DLLs ==="
        ls -la "${OUTPUT_DIR}/Libraries/" "${OUTPUT_DIR}/rml_libs/"

    - name: Build proprietary stubs (Elements.Assets, Renderite.Host)
      run: |
        dotnet build stubs/Elements.Assets/Elements.Assets.csproj -o stubs/prebuilt
        dotnet build stubs/Renderite.Host/Renderite.Host.csproj -o stubs/prebuilt

    - name: Restore dependencies
      run: dotnet restore LinuxClipboard.csproj /p:ResonitePath="${{ github.workspace }}/stubs/prebuilt"

    - name: Build
      run: dotnet build LinuxClipboard.csproj --configuration Release --no-restore /p:ResonitePath="${{ github.workspace }}/stubs/prebuilt"

    - name: Get version from csproj
      id: get_version
      run: |
        VERSION=$(grep -oP '<Version>\K[^<]+' LinuxClipboard.csproj)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./bin/Release/net10.0/LinuxClipboard.dll
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: Release v${{ steps.get_version.outputs.VERSION }}
        body: |
          Automated release from commit `${{ github.sha }}`

          ## Changes
          ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build artifacts (backup)
      uses: actions/upload-artifact@v4
      with:
        name: LinuxClipboard.dll
        path: ./bin/Release/net10.0/LinuxClipboard.dll
